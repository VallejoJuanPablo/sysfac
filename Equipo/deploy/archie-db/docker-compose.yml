services:
  # === MySQL para archie-db-server ===
  archie-mysql:
    image: mysql:8.0
    container_name: archie-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: archie_team
    volumes:
      - archie_db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - archie-internal
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # === Archie DB Server (API HTTP → MySQL) ===
  archie-db:
    build: .
    container_name: archie-db
    restart: unless-stopped
    environment:
      DB_HOST: archie-mysql
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      PORT: "3456"
    networks:
      - archie-internal
      - proxy          # Para que n8n pueda conectarse
    depends_on:
      archie-mysql:
        condition: service_healthy

networks:
  proxy:
    external: true
  archie-internal:
    driver: bridge

volumes:
  archie_db_data:
