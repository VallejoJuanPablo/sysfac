services:
  # === BASE DE DATOS ===
  sysfac-db:
    image: mysql:8.0
    container_name: sysfac-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # === BACKEND (Node.js + Express + Prisma + Puppeteer) ===
  sysfac-api:
    build:
      context: ./repo/backend
      dockerfile: Dockerfile
    container_name: sysfac-api
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      sysfac-db:
        condition: service_healthy

  # === FRONTEND (Angular 19 + Tailwind + Nginx) ===
  sysfac-web:
    build:
      context: ./repo/frontend
      dockerfile: Dockerfile
    container_name: sysfac-web
    restart: unless-stopped
    networks:
      - internal
      - proxy
    depends_on:
      - sysfac-api
    labels:
      # Traefik: rutear este dominio a este container
      - "traefik.enable=true"
      - "traefik.http.routers.sysfac.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.sysfac.entrypoints=websecure"
      - "traefik.http.routers.sysfac.tls.certresolver=letsencrypt"
      - "traefik.http.services.sysfac.loadbalancer.server.port=80"

networks:
  proxy:
    external: true                    # Red compartida con Traefik
  internal:
    driver: bridge                    # Red interna (solo este proyecto)

volumes:
  db_data:                            # Datos de MySQL persistentes
